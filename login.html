<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARKHIVEZ — Login</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-login">

  <!-- ===== SPLIT LAYOUT: Kiri = Visual, Kanan = Form ===== -->
  <div class="login-wrapper">

    <!-- Panel Kiri: Branding Visual -->
    <div class="login-visual" aria-hidden="true">
      <div class="login-visual__overlay"></div>

      <!-- Gambar latar menggunakan gradient + pattern sebagai placeholder -->
      <div class="login-visual__bg"></div>

      <div class="login-visual__content">
        <p class="login-visual__tagline">EST. 2024</p>
        <h1 class="login-visual__brand">ARKHIVEZ</h1>
        <p class="login-visual__subtitle">Fashion & Aksesoris Pria<br/>Pilihan Para Gentlemen</p>
      </div>

      <!-- Dekorasi garis diagonal -->
      <div class="login-visual__deco"></div>
    </div>

    <!-- Panel Kanan: Form Login -->
    <div class="login-form-panel">
      <div class="login-form-container">

        <!-- Logo Mobile (tersembunyi di desktop) -->
        <div class="login-logo-mobile">
          <span class="logo-text">ARKHIVEZ</span>
        </div>

        <div class="login-form-header">
          <h2 class="login-form-header__title">Selamat Datang</h2>
          <p class="login-form-header__desc">Masuk ke akun Anda untuk melanjutkan</p>
        </div>

        <!-- ===== FORM LOGIN ===== -->
        <!-- 
          JS akan membaca nilai username/password dan menentukan redirect:
          - "admin" / "admin123" → admin.html
          - "pelanggan" / "user123" (atau akun terdaftar) → catalog.html
        -->
        <form class="login-form" id="loginForm" novalidate>

          <!-- Pesan Error (disembunyikan secara default) -->
          <div class="form-error" id="formError" role="alert" aria-live="polite">
            <span class="form-error__icon">!</span>
            <span id="errorMsg">Username atau password salah.</span>
          </div>

          <!-- Field Username -->
          <div class="form-group">
            <label class="form-label" for="username">Username / Email</label>
            <div class="form-input-wrap">
              <input
                class="form-input"
                type="text"
                id="username"
                name="username"
                placeholder="Masukkan username Anda"
                autocomplete="username"
                required
              />
              <span class="form-input-line"></span>
            </div>
          </div>

          <!-- Field Password -->
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="form-input-wrap">
              <input
                class="form-input"
                type="password"
                id="password"
                name="password"
                placeholder="Masukkan password Anda"
                autocomplete="current-password"
                required
              />
              <span class="form-input-line"></span>
              <!-- Tombol toggle tampilkan/sembunyikan password -->
              <button type="button" class="btn-toggle-pw" id="togglePw" aria-label="Tampilkan password">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Akun Demo Info -->
          <div class="demo-hint">
            <p><strong>Demo:</strong> Admin → <code>admin</code> / <code>admin123</code></p>
            <p><strong>Demo:</strong> Pelanggan → <code>pelanggan</code> / <code>user123</code></p>
          </div>

          <!-- Tombol Submit -->
          <button type="submit" class="btn-login" id="btnLogin">
            <span class="btn-login__text">Masuk</span>
            <span class="btn-login__arrow">→</span>
          </button>

          <!-- Link Register (UI placeholder) -->
          <p class="login-register-link">
            Belum punya akun?
            <a href="#" onclick="alert('Fitur registrasi akan segera hadir!'); return false;">Daftar sekarang</a>
          </p>

        </form>
        <!-- END FORM LOGIN -->

      </div><!-- /.login-form-container -->
    </div><!-- /.login-form-panel -->

  </div><!-- /.login-wrapper -->

  <script src="supabase.js"></script>
  <script src="auth.js"></script>
</body>
</html>
